# Must match the Worker name in the Cloudflare dashboard, or Workers Builds
# fails its name check. This is also the first half of the workers.dev URL:
#   trivia.juliusedu.workers.dev
name = "trivia"
main = "worker/index.ts"
compatibility_date = "2025-04-01"

# Serves the built SPA. single-page-application keeps deep links working.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are the ones included on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
