<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trivia Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#1a1330; --bg-1:#241a44; --bg-2:#3b2b6b;
    --panel:#2c2150; --panel-2:#352764;
    --gold:#F2C14E; --golcandim:#b6acdf;
    --line:rgba(255,255,255,.10);
    --c1:#FF6B6B; --c2:#2EC4B6; --c3:#FFB703; --c4:#B892FF; --c5:#FF7EB6; --c6:#5AD1E8;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 90% at 50% -12%, var(--bg-2) 0%, var(--bg-1) 42%, var(--bg-0) 100%);
    background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1220px;margin:0 auto;padding:26px 22px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;letter-spacing:.3px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .tag{color:var(--ink-dim);font-size:14px}
  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s}
  .btn:hover{background:var(--panel-2);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-ghost{background:transparent}

  .board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
  .column{flex:1 1 0;min-width:150px;display:flex;flex-direction:column;gap:11px}
  .cat{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;line-height:1.15;text-align:center;
    color:#1a1330;padding:13px 9px;border-radius:12px;min-height:62px;display:flex;align-items:center;
    justify-content:center;box-shadow:var(--shadow)}
  .tile{font-family:'Fredoka',sans-serif;font-weight:700;font-size:25px;color:var(--gold);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
    border-radius:12px;min-height:58px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s ease, box-shadow .15s, border-color .15s, filter .2s;box-shadow:var(--shadow);user-select:none}
  .tile:hover{transform:translateY(-3px) scale(1.02);border-color:var(--gold);box-shadow:0 20px 40px -16px rgba(242,193,78,.35)}
  .tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .tile.used{color:var(--ink-dim);opacity:.32;cursor:default;filter:grayscale(.4);border-style:dashed}
  .tile.used:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow)}
  .tile.used::after{content:"\2713";font-size:20px}
  .tile.used span{display:none}

  .scorewrap{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  .scorehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .scorehead h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin:0;color:var(--ink)}
  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
  .team-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .team input.name{background:transparent;border:none;color:var(--ink);font-family:'Inter';font-weight:600;
    font-size:15px;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
  .team input.name:focus{outline:none;border-bottom-color:var(--line)}
  .score{font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;color:var(--gold);line-height:1;margin:2px 0 10px}
  .stepper{display:flex;gap:8px;align-items:center}
  .step{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .step:hover{background:#43327d}
  .rm{margin-left:auto;font-size:12px;color:var(--ink-dim);background:none;border:none;cursor:pointer}
  .rm:hover{color:var(--c1)}

  .scrim{position:fixed;inset:0;background:rgba(10,7,24,.72);backdrop-filter:blur(3px);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:50}
  .scrim.open{display:flex}
  .stage{position:relative;max-width:760px;width:100%;background:linear-gradient(180deg,#332560,#271c4b);
    border:1px solid var(--line);border-radius:22px;padding:38px 34px 30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);text-align:center}
  .stage::before{content:"";position:absolute;inset:-40% 10% auto 10%;height:220px;z-index:-1;
    background:radial-gradient(ellipse at 50% 0,rgba(242,193,78,.28),transparent 70%);filter:blur(6px)}
  .eyebrow{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    font-size:13px;color:var(--gold-soft)}
  .eyebrow .pts{color:var(--gold)}
  .clue{font-size:25px;line-height:1.45;font-weight:500;margin:16px 0 22px;color:#fff}
  .credit{font-size:12.5px;color:var(--ink-dim);font-style:italic;letter-spacing:.2px;margin:-12px 0 22px}
  .answer{font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;color:var(--c2);margin:6px 0 22px;
    opacity:0;transform:translateY(6px);transition:opacity .3s, transform .3s}
  .answer.show{opacity:1;transform:none}
  .answer .lbl{display:block;font-family:'Inter';font-weight:600;font-size:12px;letter-spacing:.6px;
    text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px}
  .reveal-btn{font-family:'Fredoka';font-weight:600;font-size:17px;background:var(--gold);color:#241a44;border:none;
    padding:13px 26px;border-radius:12px;cursor:pointer;transition:transform .12s, filter .15s}
  .reveal-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .award{display:none;margin-top:6px}
  .award.show{display:block}
  .award-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .award-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:600;font-size:14px;
    padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
  .award-btn:hover{background:#43327d;border-color:var(--gold)}
  .award-btn.picked{background:var(--c2);color:#0c2a26;border-color:var(--c2)}
  .award-btn.picked:hover{filter:brightness(1.05)}
  .award-btn.done-btn{background:var(--gold);color:#241a44;border-color:var(--gold);font-family:'Fredoka'}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--ink-dim);font-size:24px;cursor:pointer;line-height:1}
  .close-x:hover{color:var(--ink)}
  .foot{margin-top:34px;color:var(--ink-dim);font-size:12.5px;text-align:center;line-height:1.6}
  @media (max-width:720px){.clue{font-size:21px}.tile{font-size:22px}.logo{font-size:24px}}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">Trivia <b>Night</b></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" id="addTeam">+ Add player</button>
      <button class="btn" id="reset">Reset board</button>
    </div>
  </header>

  <div class="board" id="board"></div>

  <div class="scorewrap">
    <div class="scorehead">
      <h2>Scoreboard</h2>
    </div>
    <div class="teams" id="teams"></div>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="stage" role="dialog" aria-modal="true">
    <button class="close-x" id="closeX" aria-label="Close">&times;</button>
    <div class="eyebrow"><span id="euCat"></span> &middot; <span class="pts" id="euPts"></span></div>
    <div class="clue" id="clueText"></div>
    <div class="credit" id="clueCredit"></div>
    <div class="answer" id="answerText"><span class="lbl">Answer</span><span id="answerVal"></span></div>
    <button class="reveal-btn" id="revealBtn">Reveal answer</button>
    <div class="award" id="awardBox">
      <div class="award-row" id="awardRow"></div>
    </div>
  </div>
</div>

<script>
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];

// clue = [question, answer, credit?]  (credit shown subtly under the question for niche rounds)
const CATEGORIES = [
  { name:'Which Teammate?', clues:[
    [`Which teammate used to brew their own beer?`, `Hannah`],
    [`Which teammate was born in the Philippines?`, `Shakir`],
    [`Which teammate worked on "Popstars," the TV show that came before American Idol?`, `Daniel`],
    [`Which teammate did fifteen years of kung fu?`, `Ivan`],
    [`Which teammate lived in Madagascar for a year?`, `Juan`],
    [`Which teammate has watched all three Lord of the Rings films more than twenty times?`, `Antonela`],
  ]},
  { name:'Team Mix', clues:[
    [`Which teammate used to be a competitive figure skater?`, `Hattie`],
    [`Which teammate was once a rabbit at the White House Easter Egg Roll?`, `Lucy`],
    [`Match each to the right teammate: is a twin \u00B7 believes in ghosts \u00B7 is ambidextrous.`, `Matt (twin) \u00B7 Hannah (ghosts) \u00B7 Salomon (ambidextrous)`],
    [`Spot the lie about Ivan: (a) worked for a cat litter box company, (b) worked for a wine delivery company, (c) worked at a bike repair shop.`, `(c) the bike repair shop`],
    [`Spot the lie about Hattie: she fell down a waterfall, was recruited for a reality dating show, and won a lifetime supply of brownies.`, `Only Hattie knows \u2014 have her reveal it`],
    [`Spot the lie about Juan: he played pivot on a basketball team, would love to study theoretical maths, and can't stand big cities.`, `Only Juan knows \u2014 have him reveal it`],
  ]},
  { name:'On Screen', clues:[
    [`In 1991 this became the first animated film ever nominated for the Best Picture Oscar.`, `Beauty and the Beast`, `Hint: Hannah's specialty`],
    [`When the first Harry Potter book crossed to the US, publishers changed the title from "Philosopher's Stone" to what?`, `"Sorcerer's Stone"`, `Hint: Lucy's specialty`],
    [`Premiering in 1989, this animated sitcom is the longest-running scripted prime-time show in US TV history.`, `The Simpsons`, `Hint: Juan's specialty`],
    [`Only three films have swept the "Big Five" Oscars \u2014 Picture, Director, Actor, Actress, Screenplay. Name any one.`, `It Happened One Night / One Flew Over the Cuckoo's Nest / The Silence of the Lambs`, `Hint: Antonela's specialty`],
    [`In this 1994 Tarantino film, two hitmen kill time debating what a Quarter Pounder is called in France.`, `Pulp Fiction`, `Hint: Antonela's specialty`],
    [`This HBO drama became the network's most-watched series ever before it ended in 2019.`, `Game of Thrones`, `Hint: Hattie's specialty`],
  ]},
  { name:'Fine Print', clues:[
    [`Amazon's wordmark has an orange arrow running from the A to the Z. What everyday shape is it also drawn as?`, `A smile`, `Hint: Antonela's specialty`],
    [`The much-coveted ".tv" web domain is a major source of national income for which tiny Pacific island nation?`, `Tuvalu`, `Hint: Antonela's specialty`],
    [`English borrowed the word "tycoon," meaning a powerful businessman, in the 1800s \u2014 from the language of which country?`, `Japan (from "taikun")`, `Hint: Salomon's specialty`],
    [`This children's author drew wartime political cartoons, wrote under a pen name, and was really named Theodor Geisel.`, `Dr. Seuss`, `Hint: Matt's specialty`],
    [`Rapid fire: name three foods that start with the letter Q.`, `e.g. quiche, quinoa, quince, quail, quesadilla`, `Hint: Daniel's specialty`],
    [`Released in 2003 and still the best-selling mobile phone of all time, which Nokia model topped 250 million units?`, `The Nokia 1100`, `Hint: Juan's specialty`],
  ]},
  { name:'The Real World', clues:[
    [`A car's differential exists so that two wheels on the same axle can do what \u2014 crucial when cornering?`, `Spin at different speeds`, `Hint: Ivan's specialty`],
    [`Crude oil is separated into petrol, kerosene, and diesel by which refining process, which relies on their different boiling points?`, `Fractional distillation`, `Hint: Salomon's specialty`],
    [`Scottish Presbyterians who signed the 1638 National Covenant to resist royal control of the church became known as what?`, `The Covenanters`, `Hint: Salomon's specialty`],
    [`The wave of uprisings that swept the Middle East and North Africa in 2010\u20132011 is commonly known as what?`, `The Arab Spring`, `Hint: Hattie's specialty`],
    [`Only one nation has appeared at every FIFA World Cup since 1930. Which country?`, `Brazil`, `Hint: Shakir's specialty`],
    [`The NFL's championship trophy carries the name of which legendary Green Bay Packers coach?`, `Vince Lombardi`, `Hint: Hattie's specialty`],
  ]},
  { name:'General Trivia', clues:[
    [`Which country spans more time zones than any other, once its overseas territories are counted?`, `France (twelve)`],
    [`By total area, what is the largest desert on Earth?`, `Antarctica \u2014 a polar desert`],
    [`The smallest bone in the human body sits in the middle ear. What is it called?`, `The stapes (stirrup)`],
    [`Which is the only letter of the alphabet that appears in no US state name?`, `Q`],
    [`Tungsten has the highest melting point of any metal; its chemical symbol comes from its old name "wolfram." What is it?`, `W`],
    [`Mount Kilimanjaro, the highest peak in Africa, rises in which country?`, `Tanzania`],
  ]},
];

const cols = CATEGORIES.length;
const used = new Set();
let teams = [
  { id:1, name:'Matt', score:0 },
  { id:2, name:'Hannah', score:0 },
  { id:3, name:'Ivan', score:0 },
  { id:4, name:'Daniel', score:0 },
  { id:5, name:'Shakir', score:0 },
  { id:6, name:'Lucy', score:0 },
  { id:7, name:'Salomon', score:0 },
  { id:8, name:'Juan', score:0 },
  { id:9, name:'Antonela', score:0 },
  { id:10, name:'Hattie', score:0 },
];
let teamSeq = 11;
let open = null;
let awarded = new Set();

const boardEl = document.getElementById('board');
const teamsEl = document.getElementById('teams');

function ptsFor(r){ return (r+1)*100; }

function renderBoard(){
  boardEl.innerHTML='';
  CATEGORIES.forEach((cat,c)=>{
    const col=document.createElement('div'); col.className='column';
    const head=document.createElement('div'); head.className='cat';
    head.style.background=COLORS[c%COLORS.length]; head.textContent=cat.name;
    col.appendChild(head);
    cat.clues.forEach((clue,r)=>{
      const key=c+'-'+r;
      const t=document.createElement('button');
      t.className='tile'+(used.has(key)?' used':'');
      t.innerHTML='<span>'+ptsFor(r)+'</span>';
      if(!used.has(key)) t.addEventListener('click',()=>openClue(c,r));
      col.appendChild(t);
    });
    boardEl.appendChild(col);
  });
}

function renderTeams(){
  teamsEl.innerHTML='';
  teams.forEach((tm,i)=>{
    const el=document.createElement('div'); el.className='team';
    el.innerHTML=`
      <div class="team-top">
        <span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
        <input class="name" value="${tm.name.replace(/"/g,'&quot;')}" aria-label="Player name" />
        <button class="rm" title="Remove">remove</button>
      </div>
      <div class="score">${tm.score}</div>
      <div class="stepper">
        <button class="step minus">\u2013</button>
        <button class="step plus">+</button>
        <span class="tag" style="margin-left:6px">\u00B1 100</span>
      </div>`;
    el.querySelector('.name').addEventListener('input',e=>tm.name=e.target.value);
    el.querySelector('.plus').addEventListener('click',()=>{tm.score+=100;renderTeams();});
    el.querySelector('.minus').addEventListener('click',()=>{tm.score-=100;renderTeams();});
    el.querySelector('.rm').addEventListener('click',()=>{teams=teams.filter(x=>x.id!==tm.id);renderTeams();});
    teamsEl.appendChild(el);
  });
}

const scrim=document.getElementById('scrim');
const euCat=document.getElementById('euCat');
const euPts=document.getElementById('euPts');
const clueText=document.getElementById('clueText');
const clueCredit=document.getElementById('clueCredit');
const answerText=document.getElementById('answerText');
const answerVal=document.getElementById('answerVal');
const revealBtn=document.getElementById('revealBtn');
const awardBox=document.getElementById('awardBox');
const awardRow=document.getElementById('awardRow');

function openClue(c,r){
  open={c,r,pts:ptsFor(r)};
  const clue=CATEGORIES[c].clues[r];
  euCat.textContent=CATEGORIES[c].name;
  euPts.textContent=ptsFor(r)+' pts';
  clueText.textContent=clue[0];
  answerVal.textContent=clue[1];
  if(clue[2]){ clueCredit.textContent=clue[2]; clueCredit.style.display=''; }
  else { clueCredit.style.display='none'; }
  answerText.classList.remove('show');
  awardBox.classList.remove('show');
  revealBtn.style.display='';
  scrim.classList.add('open');
}
function reveal(){
  answerText.classList.add('show');
  revealBtn.style.display='none';
  awarded=new Set();
  renderAwardRow();
  awardBox.classList.add('show');
}
function renderAwardRow(){
  awardRow.innerHTML='';
  teams.forEach((tm,i)=>{
    const on=awarded.has(tm.id);
    const b=document.createElement('button'); b.className='award-btn'+(on?' picked':'');
    b.innerHTML=`<span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${tm.name}`+(on?' \u2713':'');
    b.addEventListener('click',()=>toggleAward(tm.id));
    awardRow.appendChild(b);
  });
  const done=document.createElement('button'); done.className='award-btn done-btn';
  done.textContent='Done'; done.addEventListener('click',closeClue);
  awardRow.appendChild(done);
}
function toggleAward(id){
  const tm=teams.find(t=>t.id===id); if(!tm) return;
  if(awarded.has(id)){awarded.delete(id);tm.score-=open.pts;}
  else{awarded.add(id);tm.score+=open.pts;}
  renderAwardRow(); renderTeams();
}
function closeClue(){
  if(open) used.add(open.c+'-'+open.r);
  open=null; scrim.classList.remove('open');
  renderBoard(); renderTeams();
}

revealBtn.addEventListener('click',reveal);
document.getElementById('closeX').addEventListener('click',closeClue);
scrim.addEventListener('click',e=>{ if(e.target===scrim) closeClue(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&open) closeClue(); });
document.getElementById('addTeam').addEventListener('click',()=>{
  teams.push({id:teamSeq++,name:'Player '+(teams.length+1),score:0}); renderTeams();
});
document.getElementById('reset').addEventListener('click',()=>{
  used.clear(); teams.forEach(t=>t.score=0); renderBoard(); renderTeams();
});

renderBoard();
renderTeams();
</script>
</body>
</html>
